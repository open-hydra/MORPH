; -----------------------------------------------------------------------------
;  MORPH driver test: block 1's i-low face recedes faster at its centre
;  (nodeshift with a bump), the interior smoothed
;
;  Every node of the face moves by nodeshift-vel*dt, and the nodes within
;  nodeshift-bump-width of the face's centre (over its unit square) by
;  nodeshift-bump-vel*dt more, times (1 - r^2/width^2)^2. With interior =
;  smooth the bump spreads into the block as the lineal-spring equilibrium
;  (the four edges keep the line law). verify.py checks the receding face, the
;  edges, the equilibrium of every step (out-diter = 1), the maximum principle
;  and that the y and z coordinates did not move.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
out-diter   = 1
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law                  = nodeshift
nodeshift-block      = 1
nodeshift-face       = 1
nodeshift-vel        = 2.5 0.0 0.0
nodeshift-bump-vel   = 2.0 0.0 0.0
nodeshift-bump-width = 0.35
interior             = smooth
smooth-tolerance     = 1.0e-12
smooth-maxit         = 100000
gcl-tolerance        = 1.0e-10
