; -----------------------------------------------------------------------------
;  MORPH driver test, a run that must be refused: the prescribed case with a
;  gcl-tolerance below round-off. The first step's discrete-GCL residual
;  (2.7e-16) exceeds it, and MORPH must stop with exit status 3.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
gcl-log     = OUTPUT/gcl.dat

[MORPH-Time]
dt    = 1.0e-3
steps = 3

[MORPH-Motion]
law   = prescribed
amp   = 2.0e-3 1.5e-3 1.0e-3
kx    = 10.0 5.0 8.0
ky    = 7.0 12.0 3.0
kz    = 4.0 6.0 9.0
omega = 50.0
gcl-tolerance = 1.0e-30
