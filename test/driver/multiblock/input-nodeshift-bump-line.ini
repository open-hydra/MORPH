; -----------------------------------------------------------------------------
;  MORPH driver test: block 1's i-low face recedes faster at its centre
;  (nodeshift with a bump), the interior under the line law
;
;  The displacement of input-nodeshift-bump.ini with interior = line (the
;  default): each grid line is compressed uniformly on its own, so the bump is
;  imprinted, scaled by s/L, on every node plane down to the pinned face.
;  verify.py repeats the law line by line.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law                  = nodeshift
nodeshift-block      = 1
nodeshift-face       = 1
nodeshift-vel        = 2.5 0.0 0.0
nodeshift-bump-vel   = 2.0 0.0 0.0
nodeshift-bump-width = 0.35
interior             = line
gcl-tolerance        = 1.0e-10
