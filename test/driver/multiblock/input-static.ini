; -----------------------------------------------------------------------------
;  MORPH driver test: the static law moves nothing, bit for bit
;
;  The mesh written must be the mesh read, value by value, and every swept
;  volume and GCL residual exactly zero (verify.py).
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 5

[MORPH-Motion]
law = static
