; -----------------------------------------------------------------------------
;  MORPH driver test, a run that must be refused: a three-component key given
;  two values. FiNeR assigns the two and leaves the third at its default
;  without a word; the driver must stop with exit status 1.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d

[MORPH-Time]
dt    = 1.0e-3
steps = 3

[MORPH-Motion]
law = translation
vel = 0.75 -0.5
