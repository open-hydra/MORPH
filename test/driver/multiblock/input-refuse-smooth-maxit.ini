; -----------------------------------------------------------------------------
;  MORPH driver test: a run the driver must refuse (exit status 2)
;
;  The bumped recession of input-nodeshift-bump.ini with one sweep allowed:
;  the smoothing cannot converge, MORPH returns status 6 (MORPH_ERR_SMOOTH)
;  with its message, and the driver stops with it. MORPH itself never stops.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law                  = nodeshift
nodeshift-block      = 1
nodeshift-face       = 1
nodeshift-vel        = 2.5 0.0 0.0
nodeshift-bump-vel   = 2.0 0.0 0.0
nodeshift-bump-width = 0.35
interior             = smooth
smooth-maxit         = 1
gcl-tolerance        = 1.0e-10
