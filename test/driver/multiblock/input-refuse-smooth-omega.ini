; -----------------------------------------------------------------------------
;  MORPH driver test: a run the driver must refuse (exit status 1)
;
;  The smoothed recession of input-nodeshift-smooth.ini with smooth-omega = 2:
;  the registry accepts it (>= 0), Morph_Run refuses it before anything moves
;  (MORPH_ERR_INPUT: the over-relaxation must stay below 2), and the driver
;  stops with exit status 1 and Morph_Run's message.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law             = nodeshift
nodeshift-block = 1
nodeshift-face  = 1
nodeshift-vel   = 2.5 0.0 0.0
interior        = smooth
smooth-omega    = 2.0
gcl-tolerance   = 1.0e-10
