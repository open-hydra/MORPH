; -----------------------------------------------------------------------------
;  MORPH driver test, a run that must be refused: nodeshift on block 4 of a
;  three-block mesh. Morph_Run refuses its input (MORPH_ERR_INPUT) before it
;  starts the mesh, and the driver must stop with exit status 1.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
gcl-log     = OUTPUT/gcl.dat

[MORPH-Time]
dt    = 1.0e-3
steps = 3

[MORPH-Motion]
law             = nodeshift
nodeshift-block = 4
nodeshift-face  = 1
nodeshift-vel   = 2.5 0.0 0.0
