; -----------------------------------------------------------------------------
;  MORPH driver test: three warped blocks (generate.py) under the prescribed law
;
;  Every coordinate moves with its own wavenumbers and phase, so the motion is
;  three-dimensional, non-uniform and aligned with no grid direction. The gate
;  is the per-step discrete-GCL residual in OUTPUT/gcl.dat (verify.py).
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
shell-diter = 5

[MORPH-Time]
t0    = 0.0
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law   = prescribed
amp   = 2.0e-3 1.5e-3 1.0e-3
kx    = 10.0 5.0 8.0
ky    = 7.0 12.0 3.0
kz    = 4.0 6.0 9.0
omega = 50.0
gcl-tolerance = 1.0e-10
