; -----------------------------------------------------------------------------
;  MORPH driver test, a run that must be refused: block 1's i-low face asked
;  to recede by 0.2 m in one step, more than its 0.18 m grid lines. The
;  nodeshift law returns MORPH_ERR_NEGVOL, a status (the library never
;  stops), and the driver must stop with exit status 2.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
gcl-log     = OUTPUT/gcl.dat

[MORPH-Time]
dt    = 1.0e-3
steps = 3

[MORPH-Motion]
law             = nodeshift
nodeshift-block = 1
nodeshift-face  = 1
nodeshift-vel   = 200.0 0.0 0.0
