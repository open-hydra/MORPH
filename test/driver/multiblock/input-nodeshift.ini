; -----------------------------------------------------------------------------
;  MORPH driver test: block 1's i-low face recedes (nodeshift)
;
;  The face moves by nodeshift-vel*dt per step, its i-high face (shared with
;  blocks 2 and 3) is pinned, and every grid line between them is compressed
;  uniformly; blocks 2 and 3 stay put (verify.py).
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law             = nodeshift
nodeshift-block = 1
nodeshift-face  = 1
nodeshift-vel   = 2.5 0.0 0.0
gcl-tolerance   = 1.0e-10
