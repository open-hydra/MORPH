; -----------------------------------------------------------------------------
;  MORPH driver test: block 1's i-low face recedes (nodeshift), the interior
;  smoothed
;
;  The same uniform recession as input-nodeshift.ini, with the nodes between
;  the receding and the pinned face placed by the lineal-spring smoothing
;  (interior = smooth) instead of the line law. On a uniformly displaced face
;  the smoothing must reproduce the line law to its tolerance; verify.py checks
;  that, and the spring equilibrium of every step from the per-step snapshots
;  (out-diter = 1).
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
out-diter   = 1
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law              = nodeshift
nodeshift-block  = 1
nodeshift-face   = 1
nodeshift-vel    = 2.5 0.0 0.0
interior         = smooth
smooth-tolerance = 1.0e-12
smooth-maxit     = 100000
gcl-tolerance    = 1.0e-10
