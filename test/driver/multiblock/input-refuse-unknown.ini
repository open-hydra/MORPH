; -----------------------------------------------------------------------------
;  MORPH driver test, a run that must be refused: a misspelt key. Without the
;  check it would be ignored and vel left at 0; the driver must stop with
;  exit status 1.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d

[MORPH-Time]
dt    = 1.0e-3
steps = 3

[MORPH-Motion]
law      = translation
velocity = 0.75 -0.5 0.25
