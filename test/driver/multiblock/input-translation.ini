; -----------------------------------------------------------------------------
;  MORPH driver test: rigid translation of the three blocks
;
;  Every node moves by vel*dt per step, boundary included; verify.py repeats
;  the additions and expects the same bits.
; -----------------------------------------------------------------------------

[MORPH-IO]
mesh-in     = INPUT/mesh.p3d
mesh-out    = OUTPUT/mesh.p3d
mesh-format = p3d
gcl-log     = OUTPUT/gcl.dat
shell-diter = 5

[MORPH-Time]
dt    = 1.0e-3
steps = 20

[MORPH-Motion]
law = translation
vel = 0.75 -0.5 0.25
gcl-tolerance = 1.0e-10
